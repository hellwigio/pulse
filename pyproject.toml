[project]
name = "pulse"
version = "0.1.0"
description = "Flask API for questions and answers"
readme = "README.md"
authors = [
    { name = "Dmitriy Hellwig", email = "dmitriy.hellwig@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "pydantic>=2.13.5",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
pulse = "pulse.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
